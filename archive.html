<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip • Instagram</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>

      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --fg: #000000;
        --muted: #737373;
        --line: #dbdbdb;
        --hover: #efefef;
        --badge-bg: #ffffff;
        --badge-fg: #000000;
        --accent: #0095f6;
      }
      :root[data-theme="dark"] {
        --bg: #0c1014;
        --surface: #1c2128;
        --fg: #f5f5f5;
        --muted: #a8a8a8;
        --line: #262b32;
        --hover: #1c2128;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: "Public Sans", system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.4;
      }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      ul { list-style: none; margin: 0; padding: 0; }
      :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

      .page { width: min(100% - 32px, 1160px); margin: 0 auto; padding: 32px 0 64px; }

      .top { display: flex; align-items: center; gap: 24px; }
      .back { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; }
      .back:hover { background: var(--hover); }
      .title { margin: 0; font-size: 22px; font-weight: 400; }

      .tabs { display: flex; justify-content: center; margin-top: 48px; border-bottom: 1px solid var(--line); }
      .tab {
        display: flex; align-items: center; gap: 8px;
        padding: 18px 0; margin-bottom: -1px;
        border-bottom: 1px solid var(--fg);
        font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      }
      .note { margin: 40px 0 24px; color: var(--muted); }

      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      @media (min-width: 640px)  { .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
      @media (min-width: 960px)  { .grid { grid-template-columns: repeat(4, 1fr); gap: 32px; } }

      .story {
        position: relative; display: block; width: 100%;
        aspect-ratio: 9 / 16; overflow: hidden;
        background: var(--hover);
        --grow: 1.03;
        transition: transform .25s ease, box-shadow .25s ease;
      }

      .story:hover,
      .story:focus-visible {
        transform: scale(var(--grow));
        z-index: 2;
        box-shadow: 0 12px 30px rgba(0, 0, 0, .3);
      }

      .story-bg {
        position: absolute; inset: -12%;
        background-size: cover; background-position: center;
        filter: blur(22px) brightness(.75);
        transition: filter .3s ease;
      }

      .story-frame {
        position: absolute; inset: 10%;
        display: flex; align-items: center; justify-content: center;
        align-items: flex-start; padding-top: 14%;
        border-radius: 18px; overflow: hidden;
        background-size: cover; background-position: center;
        box-shadow: 0 4px 18px rgba(0, 0, 0, .28);
        transition: transform .25s ease, box-shadow .25s ease;
      }
      .story:hover .story-bg,
      .story:focus-visible .story-bg { filter: blur(22px) brightness(.9); }
      .sticker {
        max-width: 86%; padding: 5px 10px; border-radius: 6px;
        background: rgba(0, 0, 0, .85); color: #fff;
        font-size: 16px; font-weight: 500; line-height: 1.3; text-align: center;
      }
      .sticker.emoji { padding: 0; background: none; font-size: 56px; line-height: 1; }
      .badge {
        position: absolute; left: 13px; top: 13px; z-index: 1;
        min-width: 46px; padding: 6px 8px; border-radius: 12px;
        background: var(--badge-bg); color: var(--badge-fg);
        text-align: center; line-height: 1.15;
        box-shadow: 0 1px 6px rgba(0, 0, 0, .18);
      }
      .badge b { display: block; font-size: 18px; font-weight: 700; }
      .badge span { display: block; font-size: 16px; }
      .badge .yr { font-size: 14px; }

      .empty { padding: 96px 0; text-align: center; }
      .empty strong { display: block; font-size: 18px; margin-bottom: 8px; }
      .empty p { margin: 0 auto; max-width: 320px; color: var(--muted); }

      .viewer {
        width: min(92vw, 25rem); margin: auto; padding: 0;
        border: 0; border-radius: 16px; overflow: hidden;
        background: var(--surface); color: var(--fg);
      }
      .viewer::backdrop { background: rgba(0, 0, 0, .7); }
      .viewer-media { position: relative; }
      .viewer-frame {
        position: relative; width: 100%; aspect-ratio: 9 / 16; max-height: 72vh; margin: 0 auto;
        display: flex; align-items: flex-start; justify-content: center; padding-top: 14%;
        background-size: cover; background-position: center;
      }
      .viewer[open] { animation: pop .18s ease-out; }
      @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
      .viewer-media .round {
        position: absolute; z-index: 2; display: flex; align-items: center; justify-content: center;
        width: 36px; height: 36px; border-radius: 50%;
        background: rgba(255, 255, 255, .92); color: #000; font-size: 22px; line-height: 1;
      }
      .round:hover { background: #fff; }
      .round[disabled] { display: none; }
      #viewer-close { top: 12px; right: 12px; }
      #viewer-prev  { top: 50%; left: 12px; transform: translateY(-50%); }
      #viewer-next  { top: 50%; right: 12px; transform: translateY(-50%); }
      .viewer-info { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
      .viewer-info p { margin: 0; }
      #viewer-date { font-weight: 600; }
      #viewer-caption { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .btn-blue {
        flex-shrink: 0; padding: 8px 14px; border-radius: 8px;
        background: var(--accent); color: #fff; font-weight: 600;
      }
      .btn-blue:hover { background: #1877f2; }

      .toast {
        position: fixed; left: 50%; bottom: 24px; z-index: 50;
        transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
        padding: 12px 16px; border-radius: 8px;
        background: var(--fg); color: var(--bg);
        transition: opacity .2s, transform .2s;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
      @media (prefers-reduced-motion: reduce) {
        .toast, .story, .story-frame, .story-bg { transition: none; }
        .story:hover, .story:focus-visible { transform: none; }
        .viewer[open] { animation: none; }
        .story:hover .story-frame, .story:focus-visible .story-frame { transform: none; }
      }
    </style>
</head>
<body>

  <main class="page">

    <header class="top">
      <a href="index.html" class="back" aria-label="Kembali ke profil">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12H4M10 6l-6 6 6 6"/>
        </svg>
      </a>
      <h1 class="title">Arsip</h1>
    </header>

    <div class="tabs" role="tablist" aria-label="Jenis arsip">
      <button class="tab" role="tab" id="tab-stories" aria-selected="true" aria-controls="archive-grid">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3.4 4.2" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5"/>
        </svg>
        Cerita
      </button>
    </div>

    <p class="note">Hanya kamu yang bisa melihat cerita yang diarsipkan, kecuali kamu memilih untuk membagikannya.</p>

    <section id="archive-grid" role="tabpanel" aria-labelledby="tab-stories"></section>

  </main>

  <dialog id="viewer" class="viewer" aria-label="Lihat cerita arsip">
    <div class="viewer-media">
      <button id="viewer-close" type="button" class="round" aria-label="Tutup">×</button>
      <button id="viewer-prev" type="button" class="round" aria-label="Sebelumnya">‹</button>
      <button id="viewer-next" type="button" class="round" aria-label="Berikutnya">›</button>
      <div id="viewer-frame" class="viewer-frame"></div>
    </div>
    <div class="viewer-info">
      <div style="min-width:0">
        <p id="viewer-date"></p>
        <p id="viewer-caption"></p>
      </div>
      <button id="viewer-restore" type="button" class="btn-blue">Kembalikan ke profil</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>

    const stories = [
      { id: 's1', day: '29', month: 'Sep', year: '2026', caption: 'Zamn',       src: 'story-1.jpg', bg: '#1e1b4b' },
      { id: 's2', day: '18', month: 'Sep', year: '',     caption: 'Lmao wkwk',       src: 'story-2.jpg', bg: '#0f766e' },
      { id: 's3', day: '14', month: 'Sep', year: '',     caption: 'masterpiece',          src: 'story-3.jpg', bg: '#b45309' },
      { id: 's4', day: '08', month: 'Jun', year: '',     caption: 'Chill',  src: 'story-4.jpg', bg: '#1d4ed8' },
      { id: 's5', day: '27', month: 'Mei', year: '',     caption: 'Ngopi',     src: 'story-5.jpg', bg: '#1c1917' },
      { id: 's6', day: '17', month: 'Agu', year: '2025', caption: 'peak',  src: 'story-6.jpg', bg: '#0369a1' }
    ];

    const $ = (id) => document.getElementById(id);
    const grid = $('archive-grid');
    const viewer = $('viewer');
    let viewIndex = 0;
    let lastOpener = null;

    function layerStyle(item) {
      return item.src
        ? `background-image:url('${item.src}')`
        : `background-image:${item.bg}`;
    }

    function badgeHTML(item) {
      return `<span class="badge"><b>${item.day}</b><span>${item.month}</span>${item.year ? `<span class="yr">${item.year}</span>` : ''}</span>`;
    }

    function stickerHTML(item) {
      const onlyEmoji = /^[\p{Extended_Pictographic}\u200d\ufe0f\s]+$/u.test(item.caption);
      return `<span class="sticker${onlyEmoji ? ' emoji' : ''}">${item.caption}</span>`;
    }

    function renderGrid() {
      if (!stories.length) {
        grid.innerHTML = `
          <div class="empty">
            <strong>Belum ada cerita di arsip</strong>
            <p>Cerita yang kamu arsipkan akan muncul di sini.</p>
          </div>`;
        return;
      }
      grid.innerHTML = `
        <ul class="grid">
          ${stories.map((item, i) => `
            <li>
              <button type="button" class="story" data-index="${i}"
                aria-label="Buka cerita ${item.day} ${item.month} ${item.year}: ${item.caption}">
                <span class="story-bg" style="${layerStyle(item)}"></span>
                <span class="story-frame" style="${layerStyle(item)}">${stickerHTML(item)}</span>
                ${badgeHTML(item)}
              </button>
            </li>`).join('')}
        </ul>`;
    }

    function renderViewer() {
      const item = stories[viewIndex];
      const frame = $('viewer-frame');
      frame.style.cssText = layerStyle(item);
      frame.innerHTML = stickerHTML(item);
      $('viewer-date').textContent = `${item.day} ${item.month}${item.year ? ' ' + item.year : ''}`;
      $('viewer-caption').textContent = item.caption;
      $('viewer-prev').disabled = viewIndex === 0;
      $('viewer-next').disabled = viewIndex === stories.length - 1;
    }

    function openViewer(index, opener) {
      viewIndex = index;
      lastOpener = opener;
      renderViewer();
      viewer.showModal();
    }

    function step(delta) {
      const next = viewIndex + delta;
      if (next < 0 || next >= stories.length) return;
      viewIndex = next;
      renderViewer();
    }

    function showToast(message) {
      const t = $('toast');
      t.textContent = message;
      t.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-index]');
      if (btn) openViewer(Number(btn.dataset.index), btn);
    });

    $('viewer-close').addEventListener('click', () => viewer.close());
    $('viewer-prev').addEventListener('click', () => step(-1));
    $('viewer-next').addEventListener('click', () => step(1));

    viewer.addEventListener('click', (e) => { if (e.target === viewer) viewer.close(); });

    viewer.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'ArrowRight') step(1);
    });

    viewer.addEventListener('close', () => {
      if (lastOpener && document.contains(lastOpener)) lastOpener.focus();
    });

    $('viewer-restore').addEventListener('click', () => {
      stories.splice(viewIndex, 1);
      lastOpener = null;
      viewer.close();
      renderGrid();
      showToast('Dikembalikan ke profil');
    });

    renderGrid();
  </script>
</body>
</html>
